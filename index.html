<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Libre</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="header-top__container">
        <a href="index.html" class="logo">
          Mercado<span>Libre</span>
        </a>

        <form class="search-bar" id="searchForm">
          <input
            type="text"
            class="search-bar__input"
            placeholder="Buscar productos, marcas y más..."
            id="searchInput"
            name= "searchProduct"
          >
          <button type="submit" class="search-bar__button" aria-label="Buscar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M21.71 20.29l-5.4-5.39A7.92 7.92 0 0018 10a8 8 0 10-8 8 7.92 7.92 0 004.9-1.69l5.39 5.4zM4 10a6 6 0 116 6 6 6 0 01-6-6z"/>
            </svg>
          </button>
        </form>

        <nav class="header-actions">
          <a href="#" class="header-actions__item">
            <span>Mis compras</span>
          </a>
          <a href="#" class="header-actions__item">
            <span>Ingresá</span>
          </a>
          <a href="#" class="header-actions__item header-actions__item--strong">
            <span>Creá tu cuenta</span>
          </a>
          <a href="#" class="header-actions__item header-actions__item--cart" aria-label="Carrito">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12L8.1 13h7.45c.75 0 1.41-.41 1.75-1.03L20.9 4H4.21l-.94-2H1zM17 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </a>
        </nav>
      </div>
    </div>

    <div class="header-bottom">
      <nav class="header-bottom__container">
        <a href="index.html?masvendido=1">Mas vendido</a>
        <a href="#">Historial</a>
        <a href="#">Supermercado</a>
        <a href="#">Moda</a>
        <a href="#">Vender</a>
        <a href="#">Ayuda</a>
      </nav>
    </div>
  </header>


  <main class="main">
    <h3 id="titulo">Inicio</h3>

    <div class="content-wrapper">

      <aside class="filters">
        <h4 class="filters__title">Filtros</h4>

        <form id="filtersForm" method="GET">

          <div class="filter-group">
            <h5 class="filter-group__title">Categoría</h5>
            <label class="filter-option">
              <input type="checkbox" name="categoria[]" value="Tecnología" class="categoria" >
              Tecnología
            </label>
            <label class="filter-option">
              <input type="checkbox" name="categoria[]" value="Moda" class="categoria">
              Moda
            </label>
            <label class="filter-option">
              <input type="checkbox" name="categoria[]" value="Hogar" class="categoria">
              Hogar
            </label>
            <label class="filter-option">
              <input type="checkbox" name="categoria[]" value="Belleza" class="categoria">
              Belleza
            </label>
            <label class="filter-option">
              <input type="checkbox" name="categoria[]" value="Deportes" class="categoria">
              Deportes
            </label>
          </div>

          <div class="filter-group">
            <h5 class="filter-group__title">Precio</h5>
            <div class="price-range">
              <input type="range" class="price-range__input" id="precioMin" name="precio_min" min="0" max="500000" step="1000" value="0">
              <input type="range" class="price-range__input" id="precioMax" name="precio_max" min="0" max="500000" step="1000" value="500000">
            </div>
            <div class="price-range__values">
              <span id="precioMinValue">$0</span>
              <span id="precioMaxValue">$500.000</span>
            </div>
          </div>

          <div class="filter-group">
            <h5 class="filter-group__title">Calificación</h5>
            <label class="filter-option">
              <input type="radio" name="calificacion" value="4" >
              <span class="filter-option__stars">★★★★☆</span> 4 y más
            </label>
            <label class="filter-option">
              <input type="radio" name="calificacion" value="3" >
              <span class="filter-option__stars">★★★☆☆</span> 3 y más
            </label>
            <label class="filter-option">
              <input type="radio" name="calificacion" value="2">
              <span class="filter-option__stars">★★☆☆☆</span> 2 y más
            </label>
            <label class="filter-option">
              <input type="radio" name="calificacion" value="1">
              <span class="filter-option__stars">★☆☆☆☆</span> 1 y más
            </label>
          </div>

          <div class="filter-group">
            <h5 class="filter-group__title">Cantidad vendida</h5>
            <label class="filter-option">
              <input type="radio" name="vendidos" value="500" >
              Más de 500 vendidos
            </label>
            <label class="filter-option">
              <input type="radio" name="vendidos" value="100" >
              Más de 100 vendidos
            </label>
            <label class="filter-option">
              <input type="radio" name="vendidos" value="50" >
              Más de 50 vendidos
            </label>
          </div>

          <div class="filter-group">
            <h5 class="filter-group__title">Envío</h5>
            <label class="filter-option">
              <input type="checkbox" name="envio_gratis" value="1" id="envioGratis">
              Envío gratis
            </label>
          </div>

          <button type="submit" class="filters__apply">Aplicar filtros</button>
          <a href="index.html" class="filters__clear">Limpiar filtros</a>

        </form>
      </aside>

      <section class="products-grid" id="productsGrid">

      </section>

    </div>
  </main>


</body>
</html>
